## 19. Нефункциональные требования

### NFR-001: Безопасность
- Все данные передаются по HTTPS (TLS 1.2+)
- Хэширование паролей (bcrypt / argon2)
- JWT-токены с коротким сроком жизни + refresh-токены
- Rate limiting на все API-эндпоинты
- Защита от CSRF, XSS, SQL-injection
- Шифрование чувствительных данных в БД (приватные ключи кошельков, персональные данные)
- IP-фильтрация для админ-панели (whitelist)
- Автоматический logout при неактивности (настраиваемый таймаут)
- HSM или vault для хранения приватных ключей hot/cold кошельков

### NFR-002: Производительность
- Время отклика API < 200 мс (p95)
- Обновление курсов в реальном времени (WebSocket)
- Поддержка не менее 1000 одновременных пользователей
- Пагинация всех больших списков
- Кэширование часто запрашиваемых данных (Redis)

### NFR-003: Надёжность
- Uptime 99.9%
- Graceful degradation при недоступности внешних сервисов
- Retry-механизмы для критических операций (блокчейн-транзакции)
- Backup базы данных (ежечасно)
- Disaster recovery план

### NFR-004: Логирование и мониторинг
- Централизованный сбор логов (ELK / Grafana Loki)
- Мониторинг метрик (Prometheus + Grafana)
- Alerting на критические события (PagerDuty / Telegram)
- Аудит-лог всех действий (неизменяемый, append-only)

### NFR-005: Масштабируемость
- Микросервисная или модульная архитектура
- Горизонтальное масштабирование stateless-сервисов
- Очереди сообщений для асинхронных задач (RabbitMQ / Kafka)
- Separate read/write для БД при необходимости

### NFR-006: Соответствие законодательству
- Соответствие законам РК об обмене цифровых активов
- GDPR-compliance (для EU-пользователей, если применимо)
- Хранение данных на территории РК (или в соответствии с требованиями)
- Хранение KYC-данных и транзакционной истории не менее 5 лет
- Возможность предоставления данных по запросу регулятора

### NFR-007: Локализация
- Поддержка языков: русский (основной), казахский, английский
- Правильное отображение валют и чисел для каждой локали
- Возможность добавления новых языков

### NFR-008: Совместимость
- Браузеры: Chrome, Firefox, Safari, Edge (последние 2 версии)
- Мобильные устройства: адаптивная вёрстка (responsive)
- Мобильное приложение — на будущее (API-first подход для готовности)

