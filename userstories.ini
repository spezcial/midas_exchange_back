### 3.3 Автоматический обмен

#### US-C-009: Создание заявки на автоматический обмен
**Как** клиент,
**я хочу** выбрать пару для обмена, указать сумму, зафиксировать курс и подтвердить обмен,
**чтобы** совершить обмен быстро и по предсказуемому курсу.

**Критерии приёмки:**
- Виджет обмена с двумя полями: «Отдаю» и «Получаю»
- Dropdown для выбора актива (с иконками монет/валют)
- Автоматический расчёт суммы получения при вводе суммы отдачи (и наоборот)
- Отображение текущего курса (realtime), комиссии платформы, комиссии сети (для крипто), итоговой суммы
- **Механизм фиксации курса:**
  - Курс отображается в реальном времени и обновляется каждые 5–10 секунд
  - При нажатии кнопки «Обменять» — курс фиксируется на настраиваемое время (по умолчанию 30 сек, настройка в админ-панели: 30 сек – 2 мин)
  - Появляется таймер обратного отсчёта и кнопка «Подтвердить обмен»
  - Если таймер истёк без подтверждения — курс автоматически обновляется, клиент может зафиксировать заново
  - При подтверждении — создаётся ордер с зафиксированным курсом
- Кнопка «Обменять» активна только если клиент прошёл KYC Level 1+ и сумма в пределах лимитов
- Валидация минимальной и максимальной суммы обмена
- Отображение сообщения при превышении лимита: «Для увеличения лимита пройдите KYC Level 2» или «Лимит исчерпан, попробуйте завтра»

#### US-C-010: Обмен актива на актив
**Как** клиент,
**я хочу** обменять один актив на другой (фиат ↔ крипто, крипто ↔ крипто),
**чтобы** быстро конвертировать средства на платформе.

**Критерии приёмки:**
- Выбор исходного и целевого актива (фиат или крипто)
- Отображение доступного баланса исходного актива
- Валидация достаточности средств (с учётом комиссии)
- Отображение актуального курса обмена
- Расчёт курса через промежуточный актив (если нет прямой пары) — отображать путь конвертации клиенту
- Списание исходного актива и зачисление целевого на внутренний баланс пользователя
- AML-проверка транзакции (автоматическая)
- Статусы ордера — см. [Карта статусов: Автоматический обмен](#автоматический-обмен)

---

### 3.4 OTC-обмен

#### US-C-013: Переключение на OTC-режим
**Как** клиент,
**я хочу** переключиться на вкладку «OTC» в верхнем меню обменника,
**чтобы** совершить крупную сделку на индивидуальных условиях.

**Критерии приёмки:**
- Вкладка «OTC» в верхней навигации платформы (рядом с «Автоматический обмен»)
- При переходе — интерфейс OTC с описанием механики работы
- Доступен только для клиентов с KYC Level 2+

#### US-C-014: Создание OTC-заявки
**Как** клиент,
**я хочу** создать заявку на OTC-обмен, указав пару, сумму и свою предлагаемую цену,
**чтобы** операционист увидел мой запрос и начал переговоры.

**Критерии приёмки:**
- Форма: пара обмена, сумма, предлагаемая цена (курс), комментарий (опционально)
- Минимальная сумма OTC-сделки (настраивается администратором, per-pair)
- Отображение текущего рыночного курса для справки
- После создания заявки — статус «Ожидает рассмотрения»
- Клиент видит заявку в разделе «Мои OTC-заявки»
- Уведомление операционисту: email + Telegram Bot

#### US-C-015: Внутренний чат по OTC-заявке
**Как** клиент,
**я хочу** общаться с операционистом в чате по моей заявке,
**чтобы** обсудить условия сделки, увидеть контрпредложение и согласовать финальную цену.

**Критерии приёмки:**
- Чат привязан к конкретной заявке
- Сообщения в реальном времени (WebSocket)
- Возможность прикреплять файлы (скриншоты, документы)
- **Карточки предложений:** и операционист, и клиент могут отправить структурированное предложение (карточка с ценой и суммой), которое вторая сторона может «Принять» / «Отклонить»
- История чата сохраняется
- Уведомления о новых сообщениях (в интерфейсе + push/email)
- Отображение метки «Операционист печатает...»

#### US-C-016: Отправка контрпредложения клиентом
**Как** клиент,
**я хочу** отправить операционисту своё контрпредложение с новой ценой,
**чтобы** продолжить переговоры структурированно, а не только текстом.

**Критерии приёмки:**
- Кнопка «Отправить предложение» в чате
- Форма: новая предлагаемая цена, сумма (может отличаться от исходной)
- Отправляется как «карточка предложения» с кнопками «Принять» / «Отклонить» для операциониста
- Автоматический расчёт итоговых сумм в карточке
- Отображается в истории переговоров (все предложения и контрпредложения — в хронологическом порядке)

#### US-C-017: Принятие / отклонение предложения операциониста
**Как** клиент,
**я хочу** принять или отклонить предложение операциониста,
**чтобы** зафиксировать сделку или продолжить переговоры.

**Критерии приёмки:**
- Кнопка «Принять» на карточке предложения — фиксация курса и суммы, переход к этапу оплаты
- Кнопка «Отклонить» — возврат к переговорам (клиент может отправить контрпредложение)
- При принятии — генерация реквизитов для оплаты
- Таймер на оплату (настраивается администратором, по умолчанию 30 мин)
- При истечении таймера — заявка автоматически переходит в статус «Истекло»

#### US-C-018: Просмотр истории OTC-заявок
**Как** клиент,
**я хочу** видеть все мои OTC-заявки с их статусами,
**чтобы** отслеживать активные и завершённые сделки.

**Критерии приёмки:**
- Список заявок с фильтрами: статус, дата, пара
- Детальный просмотр каждой заявки с историей чата и всеми предложениями
- Статусы — см. [Карта статусов: OTC-сделка](#otc-сделка)

---

### 3.5 Кошелёк и балансы

#### US-C-019: Просмотр балансов
**Как** клиент,
**я хочу** видеть все мои балансы (крипто и фиатные) на платформе,
**чтобы** понимать, какие средства у меня доступны.

**Критерии приёмки:**
- Список активов с балансами: доступный / замороженный (в ордерах или AML hold) / общий
- Эквивалент в основной фиатной валюте (KZT / USD)
- Возможность скрыть нулевые балансы
- Кнопки «Пополнить» и «Вывести» у каждого актива

#### US-C-020: Пополнение крипто-баланса
**Как** клиент,
**я хочу** пополнить свой крипто-баланс на платформе,
**чтобы** использовать его для обменов.

**Критерии приёмки:**
- Выбор актива и сети
- Генерация уникального депозитного адреса
- QR-код для адреса
- Предупреждение: «Отправляйте только [АКТИВ] в сети [СЕТЬ]. Отправка других активов может привести к потере средств»
- Минимальная сумма пополнения
- Отображение требуемого количества подтверждений сети
- Автоматическое зачисление после достижения необходимого количества подтверждений
- AML-проверка входящей транзакции (автоматическая)

#### US-C-021: Вывод криптовалюты
**Как** клиент,
**я хочу** вывести криптовалюту на внешний кошелёк,
**чтобы** перевести средства с платформы.

**Критерии приёмки:**
- Выбор актива и сети
- Ввод адреса получателя (с валидацией формата)
- Ввод суммы, отображение: комиссия платформы + комиссия сети = итоговая сумма к получению
- AML-проверка адреса получателя (автоматическая)
- Подтверждение через 2FA
- Возможность сохранить адрес в «Адресную книгу»
- Whitelist-адреса (опционально — вывод только на заранее добавленные адреса с задержкой активации 24 ч)
- Статусы вывода — см. [Карта статусов: Вывод](#вывод-криптовалюты)

#### US-C-022: Адресная книга
**Как** клиент,
**я хочу** сохранять часто используемые адреса кошельков,
**чтобы** быстро указывать их при выводе.

**Критерии приёмки:**
- Добавление адреса: название (метка), адрес, сеть, актив
- Редактирование / удаление сохранённых адресов
- При выводе — dropdown с сохранёнными адресами
- Если включён whitelist-режим: новый адрес становится доступен для вывода через 24 ч после добавления

---

### 3.6 История операций

#### US-C-023: Просмотр истории всех операций
**Как** клиент,
**я хочу** видеть полную историю моих операций (обмены, пополнения, выводы, OTC),
**чтобы** контролировать свои финансы.

**Критерии приёмки:**
- Таблица с колонками: дата, тип операции, актив, сумма, статус, детали
- Фильтры: тип (обмен / пополнение / вывод / OTC), актив, статус, период
- Экспорт в CSV / PDF
- Пагинация
- Клик на строку — детальная карточка операции (курс, комиссия платформы, комиссия сети, хэш транзакции, адреса, ссылка на Block Explorer)

---

### 3.7 Уведомления клиента

#### US-C-024: Настройка уведомлений
**Как** клиент,
**я хочу** настроить каналы и типы уведомлений,
**чтобы** получать только нужную информацию удобным способом.

**Критерии приёмки:**
- Каналы: email, push (web/mobile), Telegram
- Типы: статус обмена, статус вывода, вход в аккаунт, изменение настроек безопасности, KYC-статус, OTC-сообщения, диспуты, маркетинговые
- Матрица включения/выключения для каждого типа × каждый канал
- Критические уведомления (безопасность, блокировка) отправляются всегда и не отключаются

---

### 3.8 Настройки профиля

#### US-C-025: Редактирование профиля
**Как** клиент,
**я хочу** управлять своими личными данными и настройками безопасности,
**чтобы** поддерживать актуальность информации и защитить аккаунт.

**Критерии приёмки:**
- Просмотр и редактирование: ФИО (после KYC — только через support), email (с подтверждением нового), телефон (с OTP-подтверждением)
- Смена пароля (с вводом текущего)
- Управление 2FA
- Просмотр активных сессий (IP, устройство, время) с возможностью завершить сессию
- История действий по безопасности (входы, смена пароля, включение/выключение 2FA)
- Выбор основной валюты для отображения (KZT / USD / EUR)
- Выбор языка интерфейса
- Раздел «Мои реквизиты» — сохранённые банковские карты/счета для фиатных обменов

---

### 3.9 Поддержка / Тикеты

#### US-C-026: Создание обращения в поддержку
**Как** клиент,
**я хочу** создать тикет в службу поддержки,
**чтобы** получить помощь по вопросам, связанным с обменами или аккаунтом.

**Критерии приёмки:**
- Форма: тема (dropdown категорий: обмен, вывод, пополнение, KYC, безопасность, другое), описание, вложения (скриншоты)
- Привязка тикета к конкретной транзакции (опционально — выбор из списка операций)
- Статусы: «Открыт», «В работе», «Ожидает ответа клиента», «Эскалирован», «Закрыт»
- Переписка внутри тикета
- Уведомление при ответе саппорта
- Оценка качества обслуживания после закрытия тикета (1–5 звёзд)

---

### 3.10 Диспуты

#### US-C-027: Открытие диспута по транзакции
**Как** клиент,
**я хочу** открыть диспут (спор) по конкретной транзакции,
**чтобы** оспорить результат операции, если что-то пошло не так.

**Критерии приёмки:**
- Кнопка «Открыть диспут» доступна в карточке транзакции / ордера (для статусов: «Выполнено», «Отменено», «Ошибка»)
- Доступен в течение 14 дней после завершения / отмены операции
- Форма: причина (dropdown: не получил средства, получил неверную сумму, оплатил но ордер отменён, другое), описание проблемы, вложения (чеки, скриншоты)
- Статусы диспута — см. [Карта статусов: Диспут](#диспут)
- После открытия диспута — средства по спорной операции замораживаются (если ещё не были выведены)
- Уведомление саппорту и администратору

#### US-C-028: Участие в диспуте
**Как** клиент,
**я хочу** предоставлять дополнительные доказательства и следить за ходом диспута,
**чтобы** способствовать его скорейшему разрешению.

**Критерии приёмки:**
- Чат / переписка внутри диспута (аналогично тикету, но с отдельным статус-треком)
- Возможность прикреплять дополнительные файлы
- Видимость текущего статуса и истории решений
- Уведомления при каждом обновлении статуса
- Финальное решение (принято в пользу клиента / отклонено) с обоснованием

---

## 4. Админ-панель — Управление пользователями

#### US-A-001: Просмотр списка клиентов
**Как** администратор,
**я хочу** видеть список всех зарегистрированных клиентов,
**чтобы** управлять ими и контролировать активность.

**Критерии приёмки:**
- Таблица клиентов: ID, ФИО, email, телефон, дата регистрации, KYC-уровень, статус (активен / заблокирован / заблокирован (AML) / на проверке), суммарный объём операций
- Поиск по email, телефону, ФИО, ID
- Фильтры: KYC-уровень, статус, дата регистрации, страна
- Сортировка по любому полю
- Пагинация
- Экспорт списка в CSV

#### US-A-002: Просмотр карточки клиента
**Как** администратор,
**я хочу** открыть детальную карточку клиента,
**чтобы** видеть всю информацию о нём в одном месте.

**Критерии приёмки:**
- Личные данные (ФИО, email, телефон, ИИН, дата рождения, страна)
- KYC-данные: загруженные документы (read-only для админа), статус проверки, история изменений статуса, кто принял решение
- Балансы по всем активам (доступные / замороженные)
- История всех транзакций
- AML-скор и история проверок
- Активные сессии
- Журнал действий (логи)
- Тикеты поддержки и диспуты
- OTC-заявки
- Заметки администратора (внутренние, не видны клиенту)
- Текущие лимиты (KYC-уровня + индивидуальные, если есть)

#### US-A-003: Блокировка / разблокировка клиента
**Как** администратор,
**я хочу** заблокировать или разблокировать аккаунт клиента,
**чтобы** ограничить доступ подозрительных пользователей или восстановить доступ.

**Критерии приёмки:**
- Кнопка «Заблокировать» с обязательным указанием причины (из списка + текстовое поле)
- При блокировке — немедленное завершение всех сессий клиента
- Заблокированный клиент не может войти и совершать операции
- Уведомление клиенту о блокировке на email
- Кнопка «Разблокировать» с комментарием
- **Ограничение:** администратор не может разблокировать клиента, заблокированного AML-специалистом (статус «Заблокирован (AML)»). Такого клиента может разблокировать только AML-специалист или супер-администратор
- Все действия записываются в журнал

#### US-A-004: Просмотр KYC-данных клиента (read-only)
**Как** администратор,
**я хочу** видеть KYC-документы и статус верификации клиента,
**чтобы** иметь полную картину при работе с клиентом.

**Критерии приёмки:**
- Просмотр загруженных документов (с увеличением)
- Просмотр истории всех KYC-решений (кто, когда, какое решение, причина)
- **Администратор не может менять KYC-статус** — это полномочие compliance-специалиста
- Администратор может эскалировать вопрос compliance-специалисту (кнопка «Запросить пересмотр KYC»)

#### US-A-005: Редактирование индивидуальных лимитов клиента
**Как** администратор,
**я хочу** установить индивидуальные лимиты для конкретного клиента,
**чтобы** управлять рисками.

**Критерии приёмки:**
- Переопределение суточных и месячных лимитов
- **Ограничение:** индивидуальные лимиты не могут превышать ceiling-лимиты, установленные compliance-специалистом для данного KYC-уровня. Можно только уменьшить
- Лимиты на: обмен, пополнение, вывод (отдельно)
- Сохранение с комментарием причины изменения
- Лог изменений лимитов

#### US-A-006: Принудительный сброс 2FA клиента
**Как** администратор,
**я хочу** сбросить 2FA клиенту,
**чтобы** помочь ему восстановить доступ при утере устройства.

**Критерии приёмки:**
- Кнопка «Сбросить 2FA» в карточке клиента
- Подтверждение действия (модальное окно с предупреждением)
- Подтверждение через 2FA самого администратора
- Уведомление клиенту на email о сбросе 2FA
- Запись в журнал действий

---

## 5. Админ-панель — Управление активами и парами

#### US-A-007: Просмотр списка активов
**Как** администратор,
**я хочу** видеть все активы (фиатные и криптовалютные), поддерживаемые платформой,
**чтобы** управлять ими.

**Критерии приёмки:**
- Таблица активов: иконка, Name, Ticker, тип (фиат / крипто), Decimals, статус (активен / неактивен), поддерживаемые сети (для крипто)
- Фильтр по типу и статусу
- Поиск по имени / тикеру

#### US-A-008: Добавление нового актива
**Как** администратор,
**я хочу** добавить новый актив на платформу,
**чтобы** расширить список поддерживаемых валют.

**Критерии приёмки:**
- Форма: Name (полное название), Ticker (символ, напр. BTC, USDT, KZT), Decimals (количество знаков после запятой), тип (фиат / крипто)
- Для крипто: выбор поддерживаемых сетей, адрес контракта (для токенов)
- Загрузка иконки актива
- Установка минимальных и максимальных сумм для операций
- Статус при создании: «Неактивен» (требуется ручная активация)

#### US-A-009: Редактирование актива
**Как** администратор,
**я хочу** редактировать параметры существующего актива (Name, Ticker, Decimals и др.),
**чтобы** обновлять информацию при необходимости.

**Критерии приёмки:**
- Все поля из формы создания доступны для редактирования
- Предупреждение при изменении Decimals (может повлиять на существующие балансы)
- Возможность активировать / деактивировать актив
- При деактивации — предупреждение, если есть активные ордера или ненулевые балансы клиентов с этим активом
- Лог изменений

#### US-A-010: Просмотр и управление торговыми парами (Автоматический обмен)
**Как** администратор,
**я хочу** видеть и управлять парами, доступными для автоматического обмена,
**чтобы** контролировать, какие обмены доступны клиентам.

**Критерии приёмки:**
- Таблица пар: базовый актив, котируемый актив, спред (%), комиссия платформы, минимальная/максимальная сумма, статус (активна / неактивна), источник курса
- Добавление новой пары: выбор двух активов, установка спреда (markup), min/max сумм, привязка источника курса
- Редактирование параметров пары
- Активация / деактивация пары

#### US-A-011: Просмотр и управление торговыми парами (OTC)
**Как** администратор,
**я хочу** отдельно управлять парами, доступными в OTC-режиме,
**чтобы** OTC мог иметь свой набор пар и условий.

**Критерии приёмки:**
- Отдельная таблица OTC-пар (аналогичная структура)
- Установка минимальной суммы OTC-сделки для каждой пары
- Настройка таймаута на оплату для OTC (per-pair)
- Настройка таймаута на первый ответ операциониста (SLA)
- Активация / деактивация пар OTC

---

## 6. Админ-панель — Сети и RPC

#### US-A-012: Просмотр списка сетей (Networks)
**Как** администратор,
**я хочу** видеть все блокчейн-сети, поддерживаемые платформой,
**чтобы** контролировать подключения и статус каждой сети.

**Критерии приёмки:**
- Вкладка «Networks» в админ-панели
- Таблица сетей: название сети, Chain ID, RPC URL (основной + резервные), Block Explorer URL, статус (активна / неактивна / проблемы), текущая высота блока, задержка синхронизации
- Индикатор здоровья сети (зелёный/жёлтый/красный) на основе отклика RPC
- Время последнего успешного ответа RPC

#### US-A-013: Добавление и редактирование сети
**Как** администратор,
**я хочу** добавить новую блокчейн-сеть или отредактировать параметры существующей,
**чтобы** расширять поддержку сетей и обновлять RPC-провайдеров.

**Критерии приёмки:**
- Форма: название сети, Chain ID, тип (EVM / UTXO / другое), нативная монета
- Поля RPC: основной URL, список резервных URL (fallback)
- Кнопка «Проверить подключение» — тест RPC-эндпоинта с отображением результата (latency, высота блока)
- Количество подтверждений для зачисления (настраиваемое)
- Block Explorer URL (шаблон для tx hash и адресов)
- Активация / деактивация сети
- При деактивации — предупреждение о влиянии на связанные активы

#### US-A-014: Мониторинг RPC-провайдеров
**Как** администратор,
**я хочу** видеть метрики работы RPC-провайдеров,
**чтобы** оперативно реагировать на проблемы.

**Критерии приёмки:**
- Для каждой сети: uptime за 24ч / 7д / 30д
- Средняя задержка ответа (latency)
- Количество ошибок за период
- Автоматическое переключение на резервный RPC при падении основного
- Уведомление администратору при сбое RPC (email / Telegram)

