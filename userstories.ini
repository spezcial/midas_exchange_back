## 12. Админ-панель — Управление комиссиями на вывод

#### US-FEE-001: Просмотр комиссий на вывод
**Как** администратор,
**я хочу** видеть все комиссии на вывод по каждому активу и сети,
**чтобы** контролировать ценообразование.

**Критерии приёмки:**
- Таблица: актив, сеть, комиссия платформы (фиксированная + %), комиссия сети (estimated), итоговая комиссия для клиента, дата последнего изменения, кто изменил
- Фильтр по активу и сети

#### US-FEE-002: Настройка комиссий на вывод
**Как** администратор или операционист,
**я хочу** устанавливать и изменять комиссии на вывод криптовалюты,
**чтобы** покрывать расходы на сетевые комиссии и зарабатывать на выводах.

**Критерии приёмки:**
- Для каждой пары (актив + сеть):
  - Комиссия платформы — фиксированная (в единицах актива)
  - Комиссия платформы — процентная (от суммы вывода)
  - Минимальная комиссия
  - Режим сетевой комиссии: «автоматический» (по данным RPC) или «фиксированный» (ручная установка)
- **Доступ:** администратор — для всех активов; операционист — только для активов, связанных с OTC-парами, которые он обслуживает
- Предпросмотр: при вводе тестовой суммы — расчёт итоговой комиссии
- Лог изменений (кто, когда, старое/новое значение)
- Уведомление администратору при изменении комиссий операционистом

#### US-FEE-003: Автоматическая подстройка сетевых комиссий
**Как** система,
**мне нужно** автоматически обновлять оценку сетевых комиссий,
**чтобы** клиенты видели актуальные расходы на вывод.

**Критерии приёмки:**
- Периодический опрос RPC для оценки текущего gas price / fee rate
- Обновление estimated network fee каждые 1–5 мин (настраивается)
- При резком скачке комиссий сети (> N%) — алерт администратору
- Если режим «автоматический» — клиент видит realtime estimate; если «фиксированный» — статическое значение

