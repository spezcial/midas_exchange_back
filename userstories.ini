## 11. Админ-панель — Реквизиты компании для фиатных переводов

#### US-R-001: Просмотр реквизитов компании
**Как** администратор,
**я хочу** видеть список банковских реквизитов компании,
**чтобы** управлять тем, какие реквизиты отображаются клиентам при фиатных обменах.

**Критерии приёмки:**
- Таблица реквизитов: название (метка), тип (банковский счёт / карта), банк, номер счёта / карты / IBAN, валюта, статус (активен / неактивен), приоритет
- Фильтр по валюте и статусу

#### US-R-002: Добавление и редактирование реквизитов
**Как** администратор,
**я хочу** добавлять новые и редактировать существующие реквизиты компании,
**чтобы** клиенты видели актуальные данные для оплаты.

**Критерии приёмки:**
- Форма: название (метка, напр. «Основной счёт KZT»), тип (банковский счёт / карта), банк, номер счёта / IBAN / номер карты, БИК/SWIFT, ФИО получателя (если карта), валюта
- Привязка реквизита к конкретным фиатным валютам
- Приоритет (если несколько реквизитов для одной валюты — какой показывать клиенту первым)
- Активация / деактивация реквизита
- При деактивации — предупреждение, если реквизит используется в активных ордерах
- Лог изменений

#### US-R-003: Отображение реквизитов клиенту
**Как** система,
**мне нужно** показывать клиенту правильные реквизиты при фиатном обмене,
**чтобы** клиент знал, куда переводить средства.

**Критерии приёмки:**
- При создании ордера фиат→крипто клиенту показываются активные реквизиты для выбранной валюты (в порядке приоритета)
- Реквизиты фиксируются в ордере на момент создания (если реквизит деактивирован позже — в уже созданных ордерах он остаётся)
- Кнопка «Копировать» для каждого поля реквизита
- Предупреждение: «Переводите точную сумму. В назначении платежа укажите номер ордера [ORDER_ID]»

