## 17. Супер-администратор

#### US-SA-001: Управление сотрудниками админ-панели
**Как** супер-администратор,
**я хочу** создавать, редактировать и удалять аккаунты сотрудников в админ-панели,
**чтобы** управлять доступом персонала.

**Критерии приёмки:**
- Список сотрудников: ФИО, email, роль, статус (активен / заблокирован), дата создания, последний вход
- Создание нового сотрудника: ФИО, email, роль (администратор / операционист / AML-специалист / compliance-специалист / саппорт), временный пароль
- Отправка приглашения на email с ссылкой для установки пароля
- Редактирование данных сотрудника и роли
- Деактивация / удаление аккаунта сотрудника
- При удалении — сохранение всех действий сотрудника в журнале

#### US-SA-002: Управление ролями и правами доступа (RBAC)
**Как** супер-администратор,
**я хочу** настраивать права доступа для каждой роли,
**чтобы** каждый сотрудник видел только то, что ему необходимо.

**Критерии приёмки:**
- Матрица прав: роль × раздел/действие (CRUD)
- Предустановленные роли с базовыми правами (администратор, операционист, AML, compliance, саппорт)
- Возможность создания кастомных ролей
- Применение изменений прав мгновенно (без перелогина)

#### US-SA-003: Аудит-лог всех действий в админ-панели
**Как** супер-администратор,
**я хочу** видеть полный журнал действий всех сотрудников,
**чтобы** контролировать работу команды и расследовать инциденты.

**Критерии приёмки:**
- Все действия в админ-панели логируются: кто, когда, что, IP, User-Agent
- Фильтры по сотруднику, типу действия, дате, разделу
- Экспорт журнала
- Журнал неизменяемый (append-only)
- Хранение не менее 3 лет

#### US-SA-004: Настройки платформы
**Как** супер-администратор,
**я хочу** управлять глобальными настройками платформы,
**чтобы** адаптировать её работу под бизнес-потребности.

**Критерии приёмки:**
- Режим обслуживания (maintenance mode) — платформа недоступна для клиентов с отображением баннера
- Настройка email-шаблонов уведомлений
- Настройка Telegram Bot (токен, webhook URL)
- Настройка таймаутов (фиксация курса, оплата OTC, SLA ответа операциониста, SLA тикетов и т.д.)
- Настройка минимальных/максимальных глобальных лимитов
- Управление текстами лендинга (CMS-подобный функционал)
- Настройка порога для диспутов (через сколько дней после операции можно открыть диспут)

