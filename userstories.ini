## 7. Админ-панель — Курсы и источники

#### US-A-015: Управление источниками курсов
**Как** администратор,
**я хочу** настроить источники, из которых парсятся курсы для автоматического обмена,
**чтобы** курсы были актуальными и из надёжных источников.

**Критерии приёмки:**
- Список источников: НБ РК (Национальный банк Республики Казахстан), Binance, CoinGecko, CoinMarketCap, другие (с возможностью добавления)
- Для каждого источника: URL API, API-ключ (если требуется), частота обновления (интервал), статус (активен / ошибка), время последнего обновления
- Кнопка «Обновить сейчас» для принудительного обновления
- Приоритет источников (если основной недоступен — fallback)
- Привязка источника к конкретным парам

#### US-A-016: Настройка спреда и комиссий платформы
**Как** администратор,
**я хочу** устанавливать спред (markup) и комиссии платформы для каждой пары,
**чтобы** управлять маржинальностью.

**Критерии приёмки:**
- Спред в % от курса (отдельно для покупки и продажи)
- Фиксированная комиссия (в абсолютном значении)
- Процентная комиссия
- Минимальная комиссия
- Предпросмотр итогового курса для клиента (калькулятор)
- Возможность установить разный спред для разных KYC-уровней или объёмов (VIP-тарифы)
- Лог изменений

#### US-A-017: Просмотр истории курсов
**Как** администратор,
**я хочу** видеть историю изменения курсов по каждой паре,
**чтобы** анализировать динамику и выявлять аномалии.

**Критерии приёмки:**
- График курса за выбранный период
- Таблица: дата/время, курс (сырой от источника), курс (с учётом спреда — клиентский), источник
- Фильтр по паре и периоду
- Выделение аномальных скачков курса (отклонение > N% за короткий период)

