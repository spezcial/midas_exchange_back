## 2. Лендинг платформы

### US-L-001: Просмотр главной страницы
**Как** посетитель,
**я хочу** увидеть главную страницу с описанием платформы, преимуществами и текущими курсами,
**чтобы** понять, что предлагает сервис, и принять решение о регистрации.

**Критерии приёмки:**
- Hero-секция с заголовком, кратким описанием и CTA-кнопкой «Начать обмен» / «Зарегистрироваться»
- Секция текущих популярных курсов обмена (BTC/KZT, USDT/KZT и т.д.), обновляемых в реальном времени
- Секция «Как это работает» (3–4 шага)
- Секция преимуществ платформы (скорость, безопасность, лицензия, поддержка)
- Секция с поддерживаемыми валютами / монетами
- Секция FAQ
- Футер с контактами, ссылками на соцсети, юридической информацией
- Хэдер с навигацией: Главная, О нас, Курсы, FAQ, Войти, Зарегистрироваться

### US-L-002: Просмотр страницы курсов
**Как** посетитель,
**я хочу** видеть таблицу актуальных курсов для всех доступных пар,
**чтобы** оценить условия до регистрации.

**Критерии приёмки:**
- Таблица с колонками: пара, курс покупки, курс продажи, изменение за 24ч
- Фильтрация по типу (фиат-крипто, крипто-крипто)
- Поиск по названию актива
- Данные обновляются каждые 30–60 секунд

### US-L-003: Страница «О нас»
**Как** посетитель,
**я хочу** узнать о компании, лицензиях и команде,
**чтобы** убедиться в надёжности сервиса.

**Критерии приёмки:**
- Информация о компании: название, юрисдикция, год основания
- Номера лицензий и регуляторные статусы (с ссылками на реестры)
- Описание команды или ключевых лиц (опционально)
- Контактные данные: юридический адрес, email, телефон
- Ссылки на юридические документы: Пользовательское соглашение, Политика конфиденциальности, AML-политика

### US-L-004: Мультиязычность
**Как** посетитель,
**я хочу** переключить язык интерфейса (RU / KZ / EN),
**чтобы** пользоваться сервисом на удобном языке.

**Критерии приёмки:**
- Переключатель языка в хэдере (доступен на всех страницах)
- Все тексты лендинга, включая FAQ, юридические страницы и формы, переведены
- Сохранение выбранного языка в cookie / localStorage
- SEO: каждая языковая версия имеет свой URL (hreflang-теги)

### US-L-005: Адаптивная вёрстка
**Как** посетитель,
**я хочу** чтобы лендинг корректно отображался на мобильных устройствах и планшетах,
**чтобы** я мог ознакомиться с платформой с любого устройства.

**Критерии приёмки:**
- Корректное отображение на экранах от 320px до 2560px
- Мобильное меню (бургер) для навигации
- Таблица курсов адаптируется: горизонтальный скролл или карточный вид на мобильных
- Кнопки и формы удобны для touch-взаимодействия (min tap target 44×44px)
- Тестирование на iOS Safari, Android Chrome

