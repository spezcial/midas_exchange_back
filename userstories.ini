## 1. Роли и описание

| Роль | Описание |
|---|---|
| **Клиент** | Конечный пользователь платформы, совершает обмены (авто / OTC), проходит KYC, пополняет/выводит средства, открывает диспуты. |
| **Администратор** | Управляет активами, парами, сетями, курсами, кошельками платформы, реквизитами. Видит транзакции и клиентов, настраивает параметры. Имеет расширенные права, включающие возможности других ролей (просмотр AML-данных, compliance-отчётов, тикетов, OTC-заявок). |
| **Супер-администратор** | Все права администратора + управление персоналом админ-панели (создание/удаление аккаунтов сотрудников, назначение ролей, RBAC, глобальные настройки). |
| **Операционист** | Работает с OTC-сделками: получает уведомления, ведёт переговоры с клиентом во внутреннем чате, принимает/отклоняет/контрпредлагает. Может управлять комиссиями на вывод для OTC-сделок. |
| **Саппорт** | Обработка клиентских тикетов, ответы на обращения, эскалация на администратора или другие роли, участие в разрешении диспутов на первой линии. |
| **AML-специалист** | Мониторинг транзакций на предмет отмывания средств, блокировка подозрительных пользователей и транзакций, работа с AML-сервисами. AML-блокировка имеет высший приоритет — снять её может только AML-специалист или супер-администратор. |
| **Compliance-специалист** | Контроль соблюдения регуляторных требований, проверка KYC-документов (primary reviewer), управление лимитами по KYC-уровням, формирование отчётности. Является основным ответственным за KYC-решения. |

### Иерархия прав по ключевым действиям

| Действие | Compliance | AML | Админ | Операционист | Саппорт |
|---|---|---|---|---|---|
| KYC-проверка (решение) | ✅ Primary | — | 👁 Read-only | — | — |
| Блокировка по AML | — | ✅ Primary | 👁 Read-only | — | — |
| Блокировка (общая) | ✅ | ✅ | ✅ | — | — |
| Разблокировка после AML | — | ✅ | — (только супер-админ) | — | — |
| Управление лимитами (по KYC-уровням) | ✅ Ceiling | — | — | — | — |
| Индивидуальные лимиты клиента | — | — | ✅ (не выше ceiling compliance) | — | — |
| OTC-сделки | — | — | 👁 Read-only | ✅ Primary | — |
| Тикеты поддержки | — | — | ✅ Эскалация | — | ✅ Primary |
| Диспуты | — | — | ✅ Финальное решение | ✅ (по OTC) | ✅ Первая линия |

