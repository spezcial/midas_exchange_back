## 13. Операционист — OTC-режим

#### US-O-001: Получение уведомления о новой OTC-заявке
**Как** операционист,
**я хочу** получать уведомления о новых OTC-заявках на email и в Telegram Bot,
**чтобы** оперативно реагировать на запросы клиентов.

**Критерии приёмки:**
- Email-уведомление с деталями заявки (клиент, пара, сумма, предлагаемая цена)
- Telegram-уведомление через бота с теми же данными и быстрой ссылкой на заявку в админ-панели
- Настройка каналов уведомлений в профиле операциониста

#### US-O-002: Просмотр списка OTC-заявок
**Как** операционист,
**я хочу** видеть все OTC-заявки с их статусами,
**чтобы** управлять своей нагрузкой.

**Критерии приёмки:**
- Таблица: ID заявки, клиент, пара, сумма, предлагаемая цена, дата создания, статус, назначенный операционист, время с момента создания
- Фильтры: статус, пара, дата
- Возможность взять заявку «на себя» (назначить себя ответственным)
- Выделение новых (нерассмотренных) заявок
- Приоритизация: сортировка по сумме (по убыванию), по времени ожидания (по возрастанию)
- Алерт при превышении SLA на первый ответ (настраивается администратором)

#### US-O-003: Ведение переговоров по OTC-заявке (внутренний чат)
**Как** операционист,
**я хочу** общаться с клиентом во внутреннем чате заявки,
**чтобы** согласовать условия сделки.

**Критерии приёмки:**
- Чат в реальном времени (WebSocket)
- Возможность отправить контрпредложение (карточка с новой ценой и суммой)
- Возможность прикреплять файлы к сообщениям
- Просмотр профиля клиента в боковой панели: KYC-уровень, история OTC-сделок, объём, AML-статус
- Хронологическая лента всех предложений и контрпредложений (от обеих сторон)

#### US-O-004: Редактирование цены и отправка контрпредложения
**Как** операционист,
**я хочу** изменить предлагаемую цену и отправить контрпредложение клиенту,
**чтобы** согласовать условия, выгодные для обеих сторон.

**Критерии приёмки:**
- Поле ввода новой цены с автоматическим расчётом итоговых сумм
- Возможность также изменить сумму (предложить частичное исполнение)
- Кнопка «Отправить предложение» — клиент видит карточку с новой ценой и суммой и кнопками «Принять» / «Отклонить»
- История всех предложений и контрпредложений в чате

#### US-O-005: Принятие OTC-сделки
**Как** операционист,
**я хочу** принять заявку клиента по его цене,
**чтобы** начать процесс исполнения сделки.

**Критерии приёмки:**
- Кнопка «Принять сделку» с подтверждением
- Автоматическая фиксация курса и суммы
- Генерация реквизитов для оплаты клиенту
- Статус заявки → «Ожидает оплаты»
- Уведомление клиенту (email + push + в интерфейсе)

#### US-O-006: Отмена OTC-заявки с комментарием
**Как** операционист,
**я хочу** отменить OTC-заявку, указав причину,
**чтобы** клиент понял, почему сделка не состоялась.

**Критерии приёмки:**
- Кнопка «Отменить заявку»
- Обязательное текстовое поле с причиной отмены
- Комментарий виден клиенту в чате и в деталях заявки
- Статус заявки → «Отменено»
- Уведомление клиенту

#### US-O-007: Подтверждение получения оплаты (OTC)
**Как** операционист,
**я хочу** подтвердить получение оплаты от клиента,
**чтобы** инициировать отправку средств клиенту.

**Критерии приёмки:**
- Просмотр деталей ожидаемой оплаты
- Кнопка «Оплата получена» → запуск процесса отправки средств клиенту
- При крипто-отправке — инициирование блокчейн-транзакции (авто из hot wallet или ручное)
- При фиат-отправке — подтверждение перевода и загрузка чека
- Статус → «Отправка» → «Выполнено»

---

## 14. Саппорт (Служба поддержки)

#### US-SUP-001: Дашборд саппорта
**Как** саппорт,
**я хочу** видеть дашборд с метриками тикетов и диспутов,
**чтобы** оценить нагрузку и приоритеты.

**Критерии приёмки:**
- Количество открытых тикетов / диспутов
- Среднее время первого ответа (по тикетам)
- Среднее время закрытия тикета
- Количество тикетов по категориям
- Количество эскалированных тикетов
- SLA-виджет: сколько тикетов в пределах / за пределами SLA

#### US-SUP-002: Очередь тикетов
**Как** саппорт,
**я хочу** видеть список всех тикетов и управлять ими,
**чтобы** обрабатывать обращения клиентов.

**Критерии приёмки:**
- Таблица: ID, клиент, тема, категория, дата создания, статус, приоритет, назначенный агент, время с момента создания
- Фильтры: статус, категория, приоритет, назначенный агент, период
- Возможность назначить тикет на себя или другого агента
- Автоматическая приоритизация (тикеты с привязкой к транзакции — выше)
- Выделение тикетов, превышающих SLA

#### US-SUP-003: Работа с тикетом
**Как** саппорт,
**я хочу** отвечать клиенту в тикете, менять статус и эскалировать,
**чтобы** решить проблему клиента.

**Критерии приёмки:**
- Переписка с клиентом внутри тикета (текст + вложения)
- Просмотр профиля клиента, его транзакций, балансов в боковой панели
- Если тикет привязан к транзакции — карточка транзакции в боковой панели
- Смена статуса: «В работе», «Ожидает ответа клиента», «Закрыт»
- Кнопка «Эскалировать» — передача тикета администратору, AML или compliance с комментарием
- Внутренние заметки (видны только сотрудникам, невидимы клиенту)
- Шаблоны ответов (quick replies) для типовых вопросов

#### US-SUP-004: Работа с диспутами (первая линия)
**Как** саппорт,
**я хочу** обрабатывать диспуты на первой линии,
**чтобы** разрешить простые случаи или подготовить информацию для эскалации.

**Критерии приёмки:**
- Просмотр списка открытых диспутов
- Сбор информации: просмотр транзакции, чеков, переписки, блокчейн-данных
- Переписка с клиентом в рамках диспута
- Запрос дополнительных документов у клиента
- Если саппорт может разрешить — закрытие диспута с решением и обоснованием (требуется подтверждение администратора)
- Если не может — эскалация на администратора с подготовленным саммари

#### US-SUP-005: Эскалация диспута
**Как** саппорт,
**я хочу** эскалировать диспут на администратора или операциониста (для OTC-диспутов),
**чтобы** более опытный сотрудник принял финальное решение.

**Критерии приёмки:**
- Кнопка «Эскалировать» с выбором: на администратора / на операциониста (для OTC) / на AML (если подозрение на fraud)
- Обязательное саммари: описание проблемы, собранные доказательства, предварительное мнение
- После эскалации статус диспута → «Эскалирован»
- Уведомление получателю эскалации

#### US-A-021: Разрешение диспута (администратор)
**Как** администратор,
**я хочу** принять финальное решение по эскалированному диспуту,
**чтобы** разрешить спор клиента.

**Критерии приёмки:**
- Просмотр полной информации: транзакция, переписка с клиентом, собранные доказательства, саммари саппорта
- Варианты решения:
  - **В пользу клиента:** возврат средств (полный или частичный), повторная отправка, компенсация
  - **Отклонение:** диспут закрыт, действие платформы признано корректным
  - **Запрос доп. информации:** возврат на расследование
- Обязательное обоснование решения (текстовое поле)
- Подтверждение через 2FA (для решений с возвратом средств)
- Уведомление клиенту о решении
- Запись в неизменяемый журнал

---

## 15. AML-специалист

#### US-AML-001: Дашборд AML
**Как** AML-специалист,
**я хочу** видеть дашборд с AML-метриками,
**чтобы** быстро оценить общую ситуацию с рисками.

**Критерии приёмки:**
- Количество подозрительных транзакций за период
- Количество заблокированных пользователей
- Распределение транзакций по уровням риска (low / medium / high / critical)
- Pending-проверки (ожидающие ручного рассмотрения)
- Графики трендов

#### US-AML-002: Мониторинг транзакций
**Как** AML-специалист,
**я хочу** видеть все транзакции с AML-оценками,
**чтобы** выявлять подозрительную активность.

**Критерии приёмки:**
- Таблица транзакций с дополнительными колонками: AML-скор (risk score), флаги (sanctions, darknet, mixer, stolen funds и т.д.), источник проверки
- Фильтр по уровню риска, типу флагов
- Автоматическая пометка транзакций, превышающих пороговые значения
- Подсветка транзакций, требующих ручного рассмотрения
- Детальная карточка транзакции с полным AML-отчётом
- **Крипто→крипто обмены** помечены специальным флагом для повышенного внимания

#### US-AML-003: Проверка адреса / транзакции через AML-сервис
**Как** AML-специалист,
**я хочу** запустить ручную AML-проверку для конкретного адреса или хэша транзакции,
**чтобы** получить актуальный отчёт.

**Критерии приёмки:**
- Поле ввода адреса или tx hash
- Выбор AML-сервиса (если подключено несколько)
- Выбор сети
- Результат: risk score, категория риска, связанные адреса, флаги, визуальная карта связей (если поддерживается провайдером)
- Сохранение результата проверки в системе
- Возможность привязать результат к клиенту

#### US-AML-004: Блокировка пользователя по AML
**Как** AML-специалист,
**я хочу** заблокировать пользователя, чьи транзакции вызвали AML-тревогу,
**чтобы** предотвратить использование платформы для отмывания средств.

**Критерии приёмки:**
- Кнопка «Заблокировать (AML)» в карточке пользователя или транзакции
- Обязательное указание причины (выбор из списка + текстовое поле)
- Заморозка всех средств пользователя на платформе
- Отмена всех активных ордеров
- Завершение всех сессий
- Статус клиента → «Заблокирован (AML)» — **может быть снят только AML-специалистом или супер-администратором**
- Уведомление администратору и compliance-специалисту
- Запись в AML-журнал

#### US-AML-005: Заморозка конкретной транзакции
**Как** AML-специалист,
**я хочу** заморозить подозрительную транзакцию (остановить исполнение),
**чтобы** провести дополнительную проверку.

**Критерии приёмки:**
- Кнопка «Заморозить» для транзакций в статусах «В обработке», «Ожидает отправки»
- Указание причины
- Транзакция переходит в статус «Заморожено (AML Review)»
- Уведомление клиенту (generic формулировка, без раскрытия деталей AML-проверки)
- После проверки — возможность «Разморозить» (продолжить исполнение) или «Отклонить» (возврат средств на баланс клиента)

#### US-AML-006: AML-отчёты
**Как** AML-специалист,
**я хочу** формировать отчёты о подозрительных транзакциях (STR/SAR),
**чтобы** предоставлять их регулятору при необходимости.

**Критерии приёмки:**
- Генерация отчёта за период с фильтрами
- Формат: PDF
- Содержит: данные клиента, детали транзакций, AML-скоры, принятые меры, обоснования
- Экспорт и архивирование
- Журнал формирования отчётов (кто, когда, за какой период)

---

## 16. Compliance-специалист

#### US-COMP-001: Дашборд Compliance
**Как** compliance-специалист,
**я хочу** видеть дашборд со статистикой KYC и compliance-метриками,
**чтобы** контролировать соблюдение регуляторных требований.

**Критерии приёмки:**
- Количество пользователей по KYC-уровням
- Количество ожидающих KYC-проверок
- Количество отклонённых верификаций
- Количество пользователей из санкционных списков (если обнаружены)
- Статистика по странам регистрации
- Среднее время обработки KYC-заявки

#### US-COMP-002: Проверка KYC-документов (Primary Reviewer)
**Как** compliance-специалист,
**я хочу** просматривать и верифицировать загруженные KYC-документы,
**чтобы** подтверждать или отклонять заявки на верификацию.

**Критерии приёмки:**
- Очередь KYC-заявок (FIFO), сортировка по дате подачи
- Просмотр загруженных документов (увеличение, поворот)
- Сравнение данных из формы с данными в документе
- Результат автоматической проверки через Compliance-сервис (Sumsub, Veriff) — отображается рядом
- Кнопки «Подтвердить» / «Отклонить» / «Запросить дополнительные документы»
- При отклонении — обязательный выбор причины из списка + комментарий
- При запросе доп. документов — текстовое поле с описанием
- **Только compliance-специалист (и супер-администратор) может принимать KYC-решения**

#### US-COMP-003: Проверка пользователей по санкционным спискам
**Как** compliance-специалист,
**я хочу** проверять пользователей по санкционным спискам (OFAC, EU, UN и др.),
**чтобы** исключить работу с лицами под санкциями.

**Критерии приёмки:**
- Автоматическая проверка при регистрации и при изменении данных клиента
- Ручной запуск проверки для конкретного клиента
- Результат: совпадение / нет совпадения, детали совпадения, процент вероятности
- При совпадении — автоматическая блокировка аккаунта и уведомление compliance-специалисту для ручного рассмотрения
- Возможность подтвердить «ложное совпадение» (false positive) с обоснованием

#### US-COMP-004: Управление лимитами по KYC-уровням (ceiling)
**Как** compliance-специалист,
**я хочу** устанавливать и изменять лимиты для каждого KYC-уровня,
**чтобы** соответствовать регуляторным требованиям.

**Критерии приёмки:**
- Матрица лимитов: KYC-уровень × тип операции (обмен, пополнение, вывод) × период (сутки, месяц)
- Лимиты в фиатном эквиваленте
- **Эти лимиты являются ceiling (потолком)** — администратор может установить индивидуальные лимиты клиенту, но не выше ceiling
- Возможность задать разные лимиты для разных стран
- Лог изменений лимитов

#### US-COMP-005: Формирование регуляторной отчётности
**Как** compliance-специалист,
**я хочу** генерировать отчёты для регулятора,
**чтобы** выполнять требования законодательства.

**Критерии приёмки:**
- Отчёт о транзакциях за период (по требованию регулятора РК)
- Отчёт о подозрительных операциях
- Отчёт о количестве клиентов по KYC-уровням
- Отчёт о крупных транзакциях (выше порога)
- Экспорт в PDF / Excel
- Архив ранее сформированных отчётов

#### US-COMP-006: Журнал Compliance-действий
**Как** compliance-специалист,
**я хочу** вести журнал всех compliance-решений,
**чтобы** иметь аудиторский след для регулятора.

**Критерии приёмки:**
- Запись каждого решения: кто, когда, что, по какому клиенту/транзакции, причина
- Неизменяемый (append-only) журнал
- Поиск и фильтрация по дате, специалисту, клиенту, типу действия

