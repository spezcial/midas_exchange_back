## 9. Админ-панель — Управление кошельками платформы (Wallet Management)

#### US-W-001: Просмотр кошельков платформы
**Как** администратор,
**я хочу** видеть все кошельки платформы (hot и cold) с их балансами,
**чтобы** контролировать ликвидность и безопасность средств.

**Критерии приёмки:**
- Таблица кошельков: тип (hot / cold), сеть, актив, адрес, баланс, статус (активен / неактивен)
- Разделение на вкладки: Hot Wallets / Cold Wallets
- Для каждого кошелька: ссылка на Block Explorer
- Общий баланс платформы в эквиваленте (KZT/USD)
- Отображение суммы pending withdrawals vs баланс hot wallet

#### US-W-002: Настройка порогов hot/cold wallet
**Как** администратор,
**я хочу** настроить пороговые значения для автоматического перевода средств между hot и cold кошельками,
**чтобы** минимизировать риски хранения крупных сумм в hot wallet.

**Критерии приёмки:**
- Для каждого актива: максимальный баланс hot wallet (upper threshold) — при превышении средства автоматически переводятся в cold wallet
- Минимальный баланс hot wallet (lower threshold) — при достижении администратору приходит алерт о необходимости пополнения из cold wallet
- Критический баланс hot wallet (critical threshold) — алерт высшего приоритета, приостановка автоматических выводов
- Настройка в абсолютных значениях и/или в % от общего баланса

#### US-W-003: Ручной перевод между hot и cold кошельками
**Как** администратор,
**я хочу** инициировать перевод средств между hot и cold кошельками,
**чтобы** управлять ликвидностью вручную.

**Критерии приёмки:**
- Форма: направление (hot→cold / cold→hot), актив, сеть, сумма
- Отображение текущих балансов обоих кошельков
- Подтверждение через 2FA администратора
- Дополнительное подтверждение супер-администратором для сумм выше установленного порога
- Статусы перевода: «Ожидает подтверждения», «В обработке», «Отправлено», «Подтверждено», «Ошибка»
- Логирование с указанием инициатора

#### US-W-004: Алерты по балансам кошельков
**Как** администратор,
**я хочу** получать уведомления при критических изменениях балансов кошельков,
**чтобы** оперативно реагировать на проблемы ликвидности.

**Критерии приёмки:**
- Алерт при достижении lower threshold (предупреждение): email + Telegram
- Алерт при достижении critical threshold (критический): email + Telegram + push + звуковой сигнал в интерфейсе
- Алерт при превышении upper threshold (избыток на hot wallet): email
- Алерт при аномальном оттоке с hot wallet (сумма выводов за период > N% от баланса)
- Настройка получателей алертов (роли / конкретные сотрудники)

#### US-W-005: Генерация и ротация кошельков
**Как** администратор,
**я хочу** генерировать новые кошельки и ротировать существующие,
**чтобы** обеспечить безопасность средств.

**Критерии приёмки:**
- Генерация нового hot/cold кошелька для выбранной сети
- Процедура ротации: создание нового кошелька → перевод средств → деактивация старого
- Мониторинг остатка на старом кошельке после ротации (для получения «хвостовых» транзакций)
- Все действия записываются в журнал с указанием инициатора
- Подтверждение через 2FA + одобрение супер-администратором

#### US-W-006: История транзакций кошельков платформы
**Как** администратор,
**я хочу** видеть историю всех транзакций по кошелькам платформы,
**чтобы** проводить аудит и расследования.

**Критерии приёмки:**
- Таблица: дата, тип (входящая / исходящая / internal transfer), сумма, адрес контрагента, хэш, статус
- Фильтры: кошелёк, актив, тип, период
- Сопоставление с клиентскими операциями (к какому ордеру относится транзакция)
- Экспорт в CSV

