## 18. Интеграции

### 18.1 AML-сервисы

#### US-INT-001: Интеграция с AML-провайдером
**Как** платформа,
**мне нужно** интегрироваться с AML-сервисами (Chainalysis, Crystal, Elliptic, ScoreChain и др.),
**чтобы** автоматически проверять крипто-адреса и транзакции на предмет отмывания.

**Критерии приёмки:**
- Модульная архитектура: интерфейс (adapter pattern) для подключения разных AML-провайдеров
- Автоматическая проверка при входящем крипто-депозите (адрес отправителя)
- Автоматическая проверка при выводе (адрес получателя)
- Автоматическая проверка при крипто→крипто обмене (оба адреса)
- Настройка пороговых значений risk score для автоматических действий (пропустить / на ручную проверку / заблокировать)
- Fallback на другого провайдера при недоступности основного
- Кэширование результатов проверок (с TTL)
- Логирование всех запросов и ответов

### 18.2 Compliance-сервисы

#### US-INT-002: Интеграция с KYC/Compliance-провайдером
**Как** платформа,
**мне нужно** интегрироваться с KYC-сервисами (Sumsub, Veriff, Jumio, Onfido и др.),
**чтобы** автоматически верифицировать документы и проверять пользователей.

**Критерии приёмки:**
- Модульная архитектура (adapter pattern)
- Автоматическая проверка документов (OCR, face match, liveness check)
- Проверка по санкционным спискам (PEP, sanctions)
- Webhook для получения результатов проверки
- Отображение результатов в карточке клиента
- Настройка правил автоматического принятия / отклонения (может быть переопределена compliance-специалистом вручную)

### 18.3 RPC-провайдеры

#### US-INT-003: Интеграция с блокчейн RPC-провайдерами
**Как** платформа,
**мне нужно** подключаться к блокчейн-нодам через RPC-провайдеров (Infura, Alchemy, QuickNode, собственные ноды),
**чтобы** отслеживать транзакции, генерировать адреса и отправлять транзакции.

**Критерии приёмки:**
- Поддержка основных сетей: Ethereum, Bitcoin, Tron, BNB Chain, Polygon, TON, Solana, Arbitrum, Optimism (расширяемый список)
- Генерация депозитных адресов (HD-wallet или отдельные адреса)
- Мониторинг входящих транзакций (deposit detection)
- Отправка исходящих транзакций (withdrawals)
- Автоматическое переключение на резервный RPC
- Очередь транзакций с retry-механизмом
- Логирование всех блокчейн-взаимодействий

### 18.4 Источники курсов

#### US-INT-004: Интеграция с источниками курсов
**Как** платформа,
**мне нужно** парсить курсы из выбранных источников,
**чтобы** предоставлять актуальные цены для автоматического обмена.

**Критерии приёмки:**
- НБ РК: парсинг официальных курсов фиатных валют (API НБ РК)
- Binance: курсы крипто-пар через Binance API (WebSocket для realtime)
- CoinGecko / CoinMarketCap: fallback-источники
- Агрегация: возможность настроить формулу расчёта (среднее, медиана, конкретный источник)
- Кэширование и интервал обновления
- Alerting при недоступности источника или аномальном скачке курса (> N% за интервал)

### 18.5 Уведомления

#### US-INT-005: Интеграция с Telegram Bot
**Как** платформа,
**мне нужно** отправлять уведомления через Telegram Bot,
**чтобы** операционисты, администраторы и саппорт оперативно получали информацию.

**Критерии приёмки:**
- Создание и настройка Telegram-бота
- Уведомления: новые OTC-заявки, AML-тревоги, сбои RPC, крупные транзакции, алерты кошельков, новые диспуты
- Привязка Telegram-аккаунта сотрудника к аккаунту в системе
- Настройка типов уведомлений для каждого сотрудника

#### US-INT-006: Email-уведомления
**Как** платформа,
**мне нужно** отправлять email-уведомления,
**чтобы** клиенты и сотрудники получали важные сообщения.

**Критерии приёмки:**
- Интеграция с email-провайдером (SMTP / SendGrid / AWS SES)
- Шаблоны писем для каждого типа уведомления (HTML-шаблоны)
- Типы: подтверждение регистрации, сброс пароля, статус KYC, статус транзакции, OTC-уведомления, диспуты, блокировка аккаунта, алерты безопасности
- Управление шаблонами из админ-панели
- Отписка от маркетинговых рассылок

