## 10. Админ-панель — Балансы и казначейство платформы (Treasury)

#### US-T-001: Сводка балансов платформы
**Как** администратор,
**я хочу** видеть совокупный баланс платформы по всем активам,
**чтобы** оценить финансовое состояние.

**Критерии приёмки:**
- Таблица по активам: актив, баланс hot wallet, баланс cold wallet, общий баланс, эквивалент в KZT/USD
- Сумма обязательств перед клиентами (сумма всех клиентских балансов)
- Сальдо: общий баланс − обязательства = собственные средства платформы
- Алерт, если сальдо отрицательное (обязательства превышают активы)

#### US-T-002: Доходы и комиссии
**Как** администратор,
**я хочу** видеть отчёт о доходах платформы (заработанные комиссии и спреды),
**чтобы** анализировать финансовые результаты.

**Критерии приёмки:**
- Доход за период (день / неделя / месяц / произвольный) в разбивке по:
  - Типу операции (авто-обмен, OTC, вывод)
  - Торговой паре
  - Типу дохода (спред, комиссия платформы, комиссия за вывод)
- Графики динамики доходов
- Сравнение периодов (текущий месяц vs прошлый)
- Экспорт в CSV / Excel

#### US-T-003: Reconciliation (сверка)
**Как** администратор,
**я хочу** запускать сверку балансов (блокчейн vs БД платформы),
**чтобы** обнаруживать расхождения.

**Критерии приёмки:**
- Кнопка «Запустить сверку» для каждой сети / актива
- Сравнение: фактический баланс кошелька в блокчейне vs расчётный баланс в БД
- Отображение расхождений с суммой и направлением (избыток / недостаток)
- Автоматическая сверка по расписанию (ежедневно)
- Алерт при обнаружении расхождений выше порога
- Журнал сверок с историей

