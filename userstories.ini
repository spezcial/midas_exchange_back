## 8. Админ-панель — Транзакции и ордера

#### US-A-018: Просмотр всех транзакций
**Как** администратор,
**я хочу** видеть полный список всех транзакций на платформе,
**чтобы** мониторить операции и реагировать на инциденты.

**Критерии приёмки:**
- Таблица: ID, дата, клиент, тип (обмен / пополнение / вывод / OTC), пара/актив, сумма, курс, комиссия, статус, хэш (для крипто), AML-статус
- Фильтры: тип, статус, клиент, пара, сумма (от–до), период, AML-статус
- Поиск по ID транзакции, хэшу, email клиента
- Экспорт в CSV / Excel
- Клик на транзакцию — полная карточка с деталями

#### US-A-019: Ручное управление транзакцией
**Как** администратор,
**я хочу** вручную изменить статус транзакции (подтвердить, отклонить, вернуть),
**чтобы** обрабатывать нестандартные ситуации.

**Критерии приёмки:**
- Кнопки «Подтвердить», «Отклонить», «Вернуть средства» в карточке транзакции
- Обязательный комментарий при любом ручном действии
- Подтверждение через 2FA администратора (для финансовых действий)
- **Ограничение:** администратор не может изменить статус транзакции, замороженной AML-специалистом
- Лог всех ручных действий

#### US-A-020: Дашборд администратора
**Как** администратор,
**я хочу** видеть общую статистику платформы на дашборде,
**чтобы** быстро оценить состояние бизнеса.

**Критерии приёмки:**
- Объём обменов за сегодня / неделю / месяц (в KZT/USD)
- Количество транзакций по типам
- Количество новых клиентов
- Количество активных OTC-заявок
- Доход платформы (комиссии) за период
- Графики динамики ключевых метрик
- Статус сетей и RPC (мини-виджет)
- Количество ожидающих KYC-проверок
- Количество открытых тикетов / диспутов
- **Виджет pending withdrawals:** сумма ожидающих выводов vs баланс hot wallet (по каждому активу)
- Алерты, требующие внимания (красный бейдж)

