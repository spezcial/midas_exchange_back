## 3. Платформа обменника — Клиентская часть

### 3.1 Регистрация и аутентификация

#### US-C-001: Регистрация по email
**Как** новый пользователь,
**я хочу** зарегистрироваться, указав email и пароль,
**чтобы** получить доступ к платформе.

**Критерии приёмки:**
- Форма: email (обязательно), пароль, подтверждение пароля, согласие с Пользовательским соглашением и Политикой конфиденциальности
- Валидация формата email и сложности пароля (мин. 8 символов, заглавные, строчные, цифра, спецсимвол)
- Письмо-подтверждение на email с одноразовой ссылкой (срок действия — 24 ч)
- Аккаунт активен только после подтверждения email
- Защита от ботов (captcha)
- Проверка email на уникальность (нет дублей в системе)

#### US-C-002: Регистрация по номеру телефона
**Как** новый пользователь,
**я хочу** зарегистрироваться по номеру телефона,
**чтобы** быстро начать использовать платформу.

**Критерии приёмки:**
- Форма: номер телефона с выбором кода страны, **email (обязательно)**, пароль, подтверждение пароля, согласие с условиями
- Отправка OTP-кода по SMS для подтверждения номера телефона
- Отправка письма-подтверждения на email
- Подтверждение OTP-кода, аккаунт активен после подтверждения и email, и телефона
- Ограничение на количество попыток отправки OTP (не более 5 за 15 мин)
- Защита от ботов (captcha)

> **Примечание:** Email обязателен при любом способе регистрации, так как email используется для: KYC-уведомлений, восстановления пароля, уведомлений о блокировке, уведомлений о транзакциях, сброса 2FA.

#### US-C-003: Авторизация
**Как** зарегистрированный пользователь,
**я хочу** войти в свой аккаунт по email/телефону и паролю,
**чтобы** получить доступ к обменнику.

**Критерии приёмки:**
- Форма логина: email или телефон + пароль
- При включённом 2FA — запрос дополнительного кода
- Защита от брутфорса: блокировка после 5 неудачных попыток на 15 мин
- Запись IP и User-Agent при каждом входе
- Уведомление на email при входе с нового устройства / IP

#### US-C-004: Двухфакторная аутентификация (2FA)
**Как** пользователь,
**я хочу** включить 2FA через Google Authenticator / SMS,
**чтобы** повысить безопасность своего аккаунта.

**Критерии приёмки:**
- Настройка 2FA в профиле: выбор метода (TOTP / SMS)
- QR-код для Google Authenticator
- Генерация резервных кодов (10 шт.)
- 2FA запрашивается при входе, выводе средств и изменении настроек безопасности

#### US-C-005: Восстановление пароля
**Как** пользователь,
**я хочу** сбросить пароль через email,
**чтобы** восстановить доступ к аккаунту.

**Критерии приёмки:**
- Ввод email → отправка ссылки для сброса пароля
- Альтернативно: если привязан телефон — OTP на телефон + подтверждение email
- Новый пароль с теми же требованиями к сложности
- Ссылка сброса действует 1 час
- После сброса — автоматический разлогин на всех устройствах
- Уведомление на email о том, что пароль был изменён

---

### 3.2 KYC / Верификация

#### US-C-006: Прохождение KYC Level 1 (базовый)
**Как** клиент,
**я хочу** пройти базовую верификацию (ФИО, дата рождения, страна, ИИН/ИНН),
**чтобы** получить доступ к обменам с базовыми лимитами.

**Критерии приёмки:**
- Форма: имя, фамилия, отчество, дата рождения, гражданство, ИИН/ИНН
- Загрузка фото удостоверения личности (паспорт / ID-карта) — лицевая и оборотная сторона
- Загрузка селфи с документом
- Статусы проверки: «На проверке», «Подтверждено», «Отклонено» (с причиной)
- Уведомление на email при смене статуса
- Автоматическая отправка данных в Compliance-сервис (Sumsub / Veriff)
- Решение по KYC принимает compliance-специалист (или автоматически по результатам сервиса)

#### US-C-007: Прохождение KYC Level 2 (расширенный)
**Как** клиент,
**я хочу** пройти расширенную верификацию,
**чтобы** получить увеличенные лимиты на обмен.

**Критерии приёмки:**
- Доступен только после прохождения KYC Level 1
- Подтверждение адреса: загрузка документа (коммунальная квитанция, выписка из банка — не старше 3 месяцев)
- Указание источника средств (dropdown: зарплата, бизнес, инвестиции, наследство, другое)
- При выборе «другое» — текстовое поле для описания
- Автоматическая отправка данных в Compliance-сервис для проверки

#### US-C-008: Просмотр статуса верификации
**Как** клиент,
**я хочу** видеть текущий статус и уровень моей верификации в профиле,
**чтобы** понимать свои лимиты и что нужно сделать для их повышения.

**Критерии приёмки:**
- Отображение текущего уровня KYC (0 / 1 / 2)
- Лимиты для текущего уровня (суточный, месячный) по типам операций
- Прогресс-бар или чеклист по шагам верификации
- Причина отклонения (если есть) и кнопка «Повторить»
- Отображение использованного лимита за текущие сутки / месяц

> **KYC Level 0 (без верификации):** Клиент может только просматривать курсы и интерфейс платформы. Обмены, пополнения и выводы недоступны до прохождения KYC Level 1.

